<!doctype html><html><head><meta charset=utf8><style>body{margin:0;background:#8c8f93}</style></head>
<body><script type="module">
import * as THREE from '/vendor/three.module.js';
window.__err = null;
try {
  const q = new URL(location).searchParams;
  const what = q.get('what');
  const ships = await import('/client/js/render/ships.js');
  const planekit = await import('/client/js/render/planekit.js');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8c8f93);
  scene.add(new THREE.HemisphereLight(0xdfeaf2, 0x585f66, 1.0));
  const sun = new THREE.DirectionalLight(0xfff4e2, 1.3); sun.position.set(60, 55, 30); scene.add(sun);
  const s2 = new THREE.DirectionalLight(0xbfd4e6, 0.55); s2.position.set(-50, 25, -40); scene.add(s2);
  const g = new THREE.Group();
  if (what.startsWith('ship:')) {
    const built = ships.buildShip(what.slice(5));
    g.add(built.group);
    // Part-way through a launch, if asked: 0 is the order and 1 is the moment
    // her flight goes on the plot. A still of a ship that has an evolution to
    // play is a still of the first frame of it.
    const at = q.get('launch');
    if (at !== null && built.group.userData.launch) {
      const deck = built.group.userData.deck;
      built.group.userData.launch(0);
      built.group.userData.step(parseFloat(at) * (deck && deck.run ? deck.run : 1));
    }
  } else planekit[what](g, 0, 0, 0, 0, {});
  scene.add(g); g.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(g);
  const c = box.getCenter(new THREE.Vector3());
  const r = box.getSize(new THREE.Vector3()).length() / 2;
  const views = JSON.parse(q.get('views') || '[[1,0.10,0.02],[0.85,0.38,0.62],[0.02,0.97,0.10]]');
  const zoom = parseFloat(q.get('zoom') || '2.5');
  const W = parseInt(q.get('w') || '500', 10), H = parseInt(q.get('h') || '520', 10);
  const look = q.get('look');
  if (look) { const Lk = JSON.parse(look); c.set(Lk[0], Lk[1], Lk[2]); }
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(W * views.length, H, false);
  document.body.appendChild(renderer.domElement);
  renderer.domElement.style.width = (W * views.length) + 'px';
  renderer.setScissorTest(true);
  views.forEach((v, i) => {
    const cam = new THREE.PerspectiveCamera(32, W / H, 0.05, 6000);
    const d = new THREE.Vector3(v[0], v[1], v[2]).normalize().multiplyScalar(r * zoom);
    cam.position.copy(c).add(d); cam.lookAt(c);
    renderer.setViewport(i * W, 0, W, H);
    renderer.setScissor(i * W, 0, W, H);
    renderer.render(scene, cam);
  });
  window.__done = true;
} catch (e) { window.__err = String(e && e.stack || e); window.__done = true; }
</script></body></html>
