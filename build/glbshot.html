<!doctype html><html><head><meta charset=utf8><style>body{margin:0;background:#8c8f93}</style></head>
<body><script type="module">
// A raw sculpt, before anything is done to it: the glb's one skin, shaded,
// from a handful of directions, with a metre grid under it. For reading where
// things are on a sculpt the owner sends before cutting it into pieces.
import * as THREE from '/vendor/three.module.js';
window.__err = null;
try {
  const q = new URL(location).searchParams;
  const buf = await (await fetch('/' + q.get('f'))).arrayBuffer();
  const dv = new DataView(buf);
  let off = 12, json = null, bin = null;
  while (off < buf.byteLength) {
    const len = dv.getUint32(off, true), type = dv.getUint32(off + 4, true);
    if (type === 0x4E4F534A) json = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, off + 8, len)));
    else bin = off + 8;
    off += 8 + len;
  }
  const acc = (i) => {
    const a = json.accessors[i], v = json.bufferViews[a.bufferView];
    const n = { SCALAR: 1, VEC3: 3 }[a.type];
    const T = { 5126: Float32Array, 5125: Uint32Array, 5123: Uint16Array }[a.componentType];
    return new T(buf.slice(bin + (v.byteOffset || 0) + (a.byteOffset || 0), bin + (v.byteOffset || 0) + (a.byteOffset || 0) + a.count * n * T.BYTES_PER_ELEMENT));
  };
  const p = json.meshes[0].primitives[0];
  const pos = acc(p.attributes.POSITION), idx = acc(p.indices);
  // Into the game's frame, nose +z, put to `span`.
  const span = +(q.get('span') || 10);
  let lo = Infinity, hi = -Infinity;
  for (let i = 2; i < pos.length; i += 3) { lo = Math.min(lo, pos[i]); hi = Math.max(hi, pos[i]); }
  const S = span / (hi - lo);
  const P = new Float32Array(pos.length);
  for (let i = 0; i < pos.length; i += 3) { P[i] = pos[i + 2] * S; P[i + 1] = pos[i + 1] * S; P[i + 2] = -pos[i] * S; }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(P, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  g.computeVertexNormals();
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8c8f93);
  scene.add(new THREE.HemisphereLight(0xdfeaf2, 0x585f66, 1.0));
  const sun = new THREE.DirectionalLight(0xfff4e2, 1.3); sun.position.set(60, 55, 30); scene.add(sun);
  const s2 = new THREE.DirectionalLight(0xbfd4e6, 0.55); s2.position.set(-50, 25, -40); scene.add(s2);
  const clip = q.get('clip') ? JSON.parse(q.get('clip')).map((c) => new THREE.Plane(new THREE.Vector3(c[0], c[1], c[2]), c[3])) : [];
  scene.add(new THREE.Mesh(g, new THREE.MeshPhongMaterial({ color: 0xc8c4b8, side: THREE.DoubleSide, clippingPlanes: clip })));
  // Grids through her own origin in the three planes, a line every half metre
  // and a red one every metre, so a dimension can be read straight off a view.
  for (const [rx, rz] of [[0, 0], [Math.PI / 2, 0], [0, Math.PI / 2]]) {
    for (const [n, col] of [[40, 0x505050], [20, 0xff5050]]) {
      const gh = new THREE.GridHelper(20, n, col, col);
      gh.rotation.set(rx, 0, rz);
      gh.material.depthTest = false; gh.material.transparent = true; gh.material.opacity = col === 0x505050 ? 0.35 : 0.6;
      gh.renderOrder = 2;
      if (q.get('grid')) scene.add(gh);
    }
  }
  const ax = new THREE.AxesHelper(3); scene.add(ax);
  const box = new THREE.Box3().setFromObject(scene.children.find((o) => o.isMesh));
  const c = box.getCenter(new THREE.Vector3());
  const r = box.getSize(new THREE.Vector3()).length() / 2;
  const look = q.get('look'); if (look) { const L = JSON.parse(look); c.set(L[0], L[1], L[2]); }
  const views = JSON.parse(q.get('views') || '[[1,0,0],[0,0,1],[0,1,0.001],[0.8,0.4,0.6],[0,-1,0.001],[-0.7,-0.3,-0.6]]');
  const zoom = +(q.get('zoom') || 2.4), W = +(q.get('w') || 520), H = +(q.get('h') || 440);
  const ortho = q.get('ortho');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.localClippingEnabled = true;
  const cols = Math.min(views.length, 3), rows = Math.ceil(views.length / cols);
  renderer.setSize(W * cols, H * rows, false);
  document.body.appendChild(renderer.domElement);
  renderer.setScissorTest(true);
  views.forEach((v, i) => {
    let cam;
    if (ortho) { const h = +ortho; cam = new THREE.OrthographicCamera(-h * W / H, h * W / H, h, -h, 0.05, 500); }
    else cam = new THREE.PerspectiveCamera(32, W / H, 0.05, 6000);
    const d = new THREE.Vector3(v[0], v[1], v[2]).normalize().multiplyScalar(r * zoom);
    cam.position.copy(c).add(d); cam.lookAt(c);
    const x = (i % cols) * W, y = (rows - 1 - Math.floor(i / cols)) * H;
    renderer.setViewport(x, y, W, H); renderer.setScissor(x, y, W, H);
    renderer.render(scene, cam);
  });
  window.__done = true;
} catch (e) { window.__err = String(e && e.stack || e); window.__done = true; }
</script></body></html>
